[build-system]
requires = [
  "scikit-build-core>=0.10",
  "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "detnqs"
version = "0.3.0"
description = "DetNQS: An Efficient Framework for Neural Network Quantum States in Quantum Chemistry"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
  { name = "Zheng (Alex) Che", email = "wsmxcz@gmail.com" },
]

dependencies = [
  "flax>=0.12",
  "jax>=0.10",
  "jaxlib>=0.10",
  "numpy>=2.4",
  "optax>=0.2",
  "pyscf>=2.13",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"

wheel.packages = [
  "detnqs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = [
  "scikit-build-core>=0.10",
  "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "detnqs"
version = "0.3.0"
description = "DetNQS: An Efficient Framework for Neural Network Quantum States in Quantum Chemistry"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
  { name = "Zheng (Alex) Che", email = "wsmxcz@gmail.com" },
  { name = "libdet Authors" },
]

dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "jax>=0.8",
  "jaxlib>=0.8",
  "flax>=0.12",
  "optax>=0.2",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-benchmark",
  "ipykernel",
  "build",
  "twine",
]

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"

wheel.packages = [
  "libdet/python/libdet",
  "detnqs/python/detnqs",
]

sdist.include = [
  "CMakeLists.txt",
  "README.md",
  "LICENSE",

  "libdet/README.md",
  "libdet/csrc/**",
  "libdet/python/**",

  "detnqs/python/**",

  "examples/**",
  "tests/**",
]

sdist.exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  ".git/**",
  "build/**",
  "dist/**",
]

[tool.scikit-build.cmake.define]
DETNQS_BUILD_LIBDET = "ON"